name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# The job renames its bundle to a name that carries no version, so the README
# can link to `releases/latest/download/<name>` once and never again.
#
# macOS only. Windows and Linux are paused (tech.md 6.27, v87.16): their
# installers are neither built nor attached until the owner brings them back.
jobs:
  dmg:
    name: ad-hoc signed dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: .

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin

      # No paid Apple account, so the bundle carries an ad-hoc signature.
      # Homebrew is the supported path because the cask strips quarantine;
      # a manual install needs one right-click Open. tech.md R-7.
      - name: Ad-hoc sign
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Peekle.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Name the artifact
        id: artifact
        run: |
          SRC=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          DMG="dist/Peekle-mac-universal.dmg"
          mkdir -p dist && cp "$SRC" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: peekle-dmg
          path: ${{ steps.artifact.outputs.dmg }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.dmg }}
