name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# The job renames its bundle to a name that carries no version, so the README
# can link to `releases/latest/download/<name>` once and never again.
#
# macOS only. Windows and Linux are paused (tech.md 6.27, v87.16): their
# installers are neither built nor attached until the owner brings them back.
jobs:
  dmg:
    name: ad-hoc signed dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The tag has to name the version the app reports, or the cask rendered
      # below would point at a dmg that calls itself something else. Checked
      # before the build so a slip costs seconds, not the whole job.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $VERSION in tauri.conf.json" >&2
            exit 1
          fi

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: .

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin

      # No paid Apple account, so the bundle carries an ad-hoc signature.
      # Homebrew is the supported path because the cask strips quarantine;
      # a manual install clears it by hand. tech.md R-7.
      - name: Ad-hoc sign
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Peekle.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      # The `peekle` command rides inside the bundle (scripts/build-cli.mjs,
      # tech.md 6.27). Both slices, and the version the tag names.
      - name: Check the bundled command
        run: |
          CLI="target/universal-apple-darwin/release/bundle/macos/Peekle.app/Contents/MacOS/peekle"
          lipo -info "$CLI" | grep -q 'x86_64 arm64'
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$("$CLI" --version)" = "peekle $VERSION"

      - name: Name the artifact
        id: artifact
        run: |
          SRC=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          DMG="dist/Peekle-mac-universal.dmg"
          mkdir -p dist && cp "$SRC" "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DMG"

      # Rendered here and only here: the tap copies this file as it is
      # (tech.md 11). The template is .github/homebrew/peekle.rb.
      - name: Render the cask
        id: cask
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SHA=$(shasum -a 256 "${{ steps.artifact.outputs.dmg }}" | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" \
            .github/homebrew/peekle.rb > dist/peekle.rb
          ruby -c dist/peekle.rb
          grep -q "$SHA" dist/peekle.rb && grep -q "\"$VERSION\"" dist/peekle.rb
          echo "cask=dist/peekle.rb" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: peekle-dmg
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.cask.outputs.cask }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.cask.outputs.cask }}
