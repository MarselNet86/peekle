[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nurikd/peekle"

[workspace.lints.clippy]
# CLAUDE.md forbids unwrap outside tests. clippy.toml exempts test code.
unwrap_used = "deny"

[profile.dev]
# Full DWARF for the whole Tauri graph costs several gigabytes on disk.
# Line tables keep backtraces readable, which is what debugging actually needs.
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
