[package]
name = "peekle"
description = "Overlay on top of Claude Code for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "peekle_lib"
# staticlib is for iOS and cdylib for Android. Section 2 ships macOS only, and
# the two of them cost half a gigabyte of build output for nothing.
crate-type = ["rlib"]

# The app binary is not called `peekle`, and that is deliberate. `peekle` is the
# CLI, and two crates in one workspace producing the same binary name write to
# the same path in target/: whichever built last silently wins. tech.md 5.
[[bin]]
name = "peekle-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peekle-core = { version = "0.1.0", path = "../crates/peekle-core" }
thiserror = "2.0.20"
peekle-server = { version = "0.1.0", path = "../crates/peekle-server" }
peekle-usage = { version = "0.1.0", path = "../crates/peekle-usage" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-global-shortcut = "2.3.2"
peekle-hotkey = { version = "0.1.0", path = "../crates/peekle-hotkey" }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"

# macOS only: the panel and everything AppKit. tech.md 6.27.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
block2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }

# Windows and Linux: the system trash, the clipboard picture, and PNG to write
# it as a file. tech.md 6.27.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"
arboard = { version = "3", default-features = false }
png = "0.17"

# Windows alone: the clipboard change counter and a process query. tech.md 6.27.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole"] }

[lints]
workspace = true

[dev-dependencies]
# Property tests for the pure decisions of this crate. tech.md 10.
proptest = "1.11.0"
